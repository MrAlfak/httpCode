<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Verified standard and vendor-specific HTTP status code reference.">
  <title>HTTP Status Codes — Verified Reference</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero"><div class="container">
    <div class="eyebrow">IANA + vendor-aware reference</div><h1>HTTP Status Codes</h1>
    <p class="lede">Search standard HTTP statuses and vendor-specific meanings without collapsing conflicting codes.</p>
    <div class="controls" aria-label="Reference filters">
      <div class="field field-search"><label for="search">Search</label><input id="search" type="search" autocomplete="off" placeholder="404, timeout, cloudflare…"></div>
      <div class="field"><label for="type-filter">Type</label><select id="type-filter"><option value="">All types</option><option value="standard">Standard</option><option value="vendor">Vendor</option></select></div>
      <div class="field"><label for="provider-filter">Provider</label><select id="provider-filter"><option value="">All providers</option></select></div>
      <div class="field"><label for="status-filter">Lifecycle</label><select id="status-filter"><option value="">All states</option><option value="active">Active</option><option value="temporary">Temporary</option><option value="unused">Unused</option><option value="obsoleted">Obsoleted</option></select></div>
      <div class="field"><label for="lang-select">Language</label><select id="lang-select"><option value="en">English</option></select></div>
    </div>
    <div class="meta-row"><span id="result-count" aria-live="polite">Loading…</span><span id="coverage-note"></span></div>
  </div></header>
  <main class="container"><section id="detail" class="detail" hidden aria-live="polite"></section><section id="results" class="grid" aria-label="HTTP status code results"></section><div id="empty" class="empty" hidden>No matching status codes.</div></main>
  <footer><div class="container footer-row"><span>MIT Licensed</span><span>Standard entries track the pinned IANA registry snapshot.</span></div></footer>
  <script src="/script.js"></script>
</body></html>
